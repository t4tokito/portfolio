<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" fill="none">
  <defs>
    <linearGradient id="pg-bg" x1="0" y1="0" x2="600" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="pg-accent" x1="180" y1="120" x2="420" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <radialGradient id="pg-glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="600" height="440" fill="url(#pg-bg)"/>

  <!-- subtle grid -->
  <g stroke="#a855f7" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 80 H600 M0 160 H600 M0 240 H600 M0 320 H600 M0 400 H600"/>
    <path d="M80 0 V440 M160 0 V440 M240 0 V440 M320 0 V440 M400 0 V440 M480 0 V440"/>
  </g>

  <!-- ambient glow -->
  <circle cx="300" cy="178" r="170" fill="url(#pg-glow)"/>

  <!-- main icon: document with AI sparkle -->
  <g transform="translate(300 168)">
    <!-- outer dashed ring -->
    <circle r="92" fill="none" stroke="url(#pg-accent)" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 10"/>

    <!-- document body -->
    <rect x="-40" y="-55" width="80" height="100" rx="8" fill="#0c0c0e" stroke="url(#pg-accent)" stroke-width="3"/>

    <!-- folded corner -->
    <path d="M20 -55 L40 -35 L20 -35 Z" fill="#0c0c0e" stroke="url(#pg-accent)" stroke-width="3" stroke-linejoin="round"/>

    <!-- text lines -->
    <rect x="-26" y="-22" width="44" height="4" rx="2" fill="url(#pg-accent)" opacity="0.6"/>
    <rect x="-26" y="-10" width="32" height="4" rx="2" fill="url(#pg-accent)" opacity="0.4"/>
    <rect x="-26" y="2" width="38" height="4" rx="2" fill="url(#pg-accent)" opacity="0.5"/>
    <rect x="-26" y="14" width="28" height="4" rx="2" fill="url(#pg-accent)" opacity="0.3"/>

    <!-- AI sparkle on top right -->
    <g transform="translate(38 -42)">
      <path d="M0 -12 L3 -2 L12 0 L3 2 L0 12 L-3 2 L-12 0 L-3 -2 Z" fill="url(#pg-accent)"/>
      <circle cx="8" cy="-10" r="2" fill="#c084fc" opacity="0.7"/>
    </g>

    <!-- small decorative dots -->
    <circle cx="-50" cy="40" r="4" fill="#a855f7" opacity="0.5"/>
    <circle cx="52" cy="-38" r="3" fill="#c084fc" opacity="0.4"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="340" text-anchor="middle"
        font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="48" font-weight="700"
        fill="#f4f4f5" letter-spacing="1">Post<tspan fill="url(#pg-accent)">Gen</tspan></text>

  <!-- tagline -->
  <text x="300" y="378" text-anchor="middle"
        font-family="'Space Grotesk', monospace" font-size="16" font-weight="500"
        fill="#a1a1aa" letter-spacing="3">AI&#160;&#160;CONTENT&#160;&#160;CREATOR</text>

  <!-- corner brackets -->
  <g stroke="#a855f7" stroke-width="1.5" opacity="0.35">
    <line x1="20" y1="20" x2="40" y2="20"/><line x1="20" y1="20" x2="20" y2="40"/>
    <line x1="580" y1="20" x2="560" y2="20"/><line x1="580" y1="20" x2="580" y2="40"/>
    <line x1="20" y1="420" x2="40" y2="420"/><line x1="20" y1="420" x2="20" y2="400"/>
    <line x1="580" y1="420" x2="560" y2="420"/><line x1="580" y1="420" x2="580" y2="400"/>
  </g>
</svg>
