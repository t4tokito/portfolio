<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" fill="none">
  <defs>
    <linearGradient id="ig-bg" x1="0" y1="0" x2="600" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="ig-accent" x1="180" y1="120" x2="420" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.4" stop-color="#f97316"/>
      <stop offset="0.8" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="ig-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="ig-glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="600" height="440" fill="url(#ig-bg)"/>

  <!-- subtle grid -->
  <g stroke="#f97316" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 80 H600 M0 160 H600 M0 240 H600 M0 320 H600 M0 400 H600"/>
    <path d="M80 0 V440 M160 0 V440 M240 0 V440 M320 0 V440 M400 0 V440 M480 0 V440"/>
  </g>

  <!-- ambient glow -->
  <circle cx="300" cy="178" r="170" fill="url(#ig-glow)"/>

  <!-- main icon: camera/instagram style -->
  <g transform="translate(300 168)">
    <!-- outer dashed ring -->
    <circle r="92" fill="none" stroke="url(#ig-accent)" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 10"/>

    <!-- camera body -->
    <rect x="-44" y="-44" width="88" height="88" rx="20" fill="#0c0c0e" stroke="url(#ig-accent)" stroke-width="3"/>

    <!-- camera lens -->
    <circle r="26" fill="none" stroke="url(#ig-accent)" stroke-width="3"/>
    <circle r="16" fill="none" stroke="url(#ig-accent)" stroke-width="2" opacity="0.6"/>
    <circle r="6" fill="url(#ig-accent)" opacity="0.8"/>

    <!-- camera flash dot -->
    <circle cx="28" cy="-28" r="5" fill="url(#ig-accent)"/>

    <!-- auto/sparkle indicator -->
    <g transform="translate(-38 -38)">
      <path d="M0 -10 L2.5 -2 L10 0 L2.5 2 L0 10 L-2.5 2 L-10 0 L-2.5 -2 Z" fill="url(#ig-accent)" opacity="0.8"/>
    </g>

    <!-- small decorative dots -->
    <circle cx="52" cy="40" r="4" fill="#f97316" opacity="0.5"/>
    <circle cx="-52" cy="-40" r="3" fill="#d946ef" opacity="0.4"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="340" text-anchor="middle"
        font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="48" font-weight="700"
        fill="#f4f4f5" letter-spacing="1">Insta<tspan fill="url(#ig-accent)">Auto</tspan></text>

  <!-- tagline -->
  <text x="300" y="378" text-anchor="middle"
        font-family="'Space Grotesk', monospace" font-size="16" font-weight="500"
        fill="#a1a1aa" letter-spacing="3">INSTAGRAM&#160;&#160;AUTOMATION</text>

  <!-- corner brackets -->
  <g stroke="#f97316" stroke-width="1.5" opacity="0.35">
    <line x1="20" y1="20" x2="40" y2="20"/><line x1="20" y1="20" x2="20" y2="40"/>
    <line x1="580" y1="20" x2="560" y2="20"/><line x1="580" y1="20" x2="580" y2="40"/>
    <line x1="20" y1="420" x2="40" y2="420"/><line x1="20" y1="420" x2="20" y2="400"/>
    <line x1="580" y1="420" x2="560" y2="420"/><line x1="580" y1="420" x2="580" y2="400"/>
  </g>
</svg>
